<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Offline — VED Foundation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:#0A1628;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:48px 40px;text-align:center;max-width:400px;width:100%;}
  .icon{width:72px;height:72px;background:linear-gradient(135deg,#F97316,#FBBF24);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px;}
  h1{font-size:24px;font-weight:700;margin-bottom:10px;}
  p{font-size:14px;color:rgba(255,255,255,0.6);line-height:1.6;margin-bottom:28px;}
  .btn{display:inline-block;background:linear-gradient(135deg,#1A4FBB,#2563EB);color:#fff;padding:12px 28px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:opacity 0.2s;}
  .btn:hover{opacity:0.85;}
  .status{margin-top:20px;font-size:12px;color:rgba(255,255,255,0.4);}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>VED Foundation Admin Portal needs an internet connection to load fresh data. Please check your network and try again.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="status" id="status">Checking connection…</div>
  </div>
  <script>
    function checkOnline() {
      const s = document.getElementById('status');
      if (navigator.onLine) {
        s.textContent = '✅ Connection restored — reloading…';
        setTimeout(() => window.location.href = '/Dashboard.html', 1000);
      } else {
        s.textContent = '❌ Still offline. Waiting…';
      }
    }
    window.addEventListener('online', checkOnline);
    checkOnline();
    setInterval(checkOnline, 5000);
  </script>
</body>
</html>
