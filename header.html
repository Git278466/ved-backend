<!-- header.html -->

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

.navbar{
  background:#ffffff;
  position:sticky;
  top:0;
  z-index:9999;
  box-shadow:0 8px 22px rgba(15,23,42,.08);
}

.nav-container{
  width:100%;
  max-width:1350px;
  margin:auto;
  padding:0 20px;
}

.nav-inner{
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  min-width:240px;
}

.brand img{
  width:54px;
  height:54px;
  object-fit:contain;
  border-radius:12px;
  background:#fff;
  border:1px solid #edf2f7;
  padding:5px;
}

.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1.05;
}

.brand-text strong{
  color:#0b2b5e;
  font-size:1rem;
  font-weight:900;
}

.brand-text span{
  font-size:.72rem;
  color:#64748b;
  font-weight:600;
  margin-top:4px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav-links a{
  position:relative;
  text-decoration:none;
  color:#24344d;
  font-size:.92rem;
  font-weight:800;
  padding:26px 0;
  transition:.25s;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:18px;
  width:0;
  height:3px;
  background:#f7941d;
  border-radius:3px;
  transition:.25s;
}

.nav-links a:hover{
  color:#0b63ce;
}

.nav-links a:hover::after{
  width:100%;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  padding:11px 20px;
  border-radius:6px;
  font-size:.88rem;
  font-weight:900;
  transition:.25s;
  white-space:nowrap;
}

.btn-orange{
  background:#f7941d;
  color:#fff;
  box-shadow:0 10px 22px rgba(247,148,29,.30);
}

.btn-orange:hover{
  background:#e57900;
  transform:translateY(-2px);
}

.btn-blue{
  background:#0b63ce;
  color:#fff;
  box-shadow:0 10px 22px rgba(11,99,206,.25);
}

.btn-blue:hover{
  background:#084da4;
  transform:translateY(-2px);
}

.menu-toggle{
  display:none;
  border:none;
  background:none;
  font-size:2rem;
  color:#0b63ce;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:1100px){

  .menu-toggle{
    display:block;
  }

  .nav-actions{
    display:none;
  }

  .nav-links{
    position:fixed;
    left:0;
    top:74px;
    width:100%;
    background:#fff;
    flex-direction:column;
    align-items:flex-start;
    gap:0;
    max-height:0;
    overflow:hidden;
    transition:.35s ease;
    box-shadow:0 12px 24px rgba(0,0,0,.08);
    z-index:9998;
  }

  .nav-links.show{
    max-height:520px;
    padding:10px 25px 20px;
  }

  .nav-links a{
    width:100%;
    padding:14px 0;
    border-bottom:1px solid #eef2f7;
  }

  .nav-links a::after{
    display:none;
  }

}

@media(max-width:640px){

  .brand{
    min-width:auto;
  }

  .brand img{
    width:46px;
    height:46px;
  }

  .brand-text strong{
    font-size:.85rem;
  }

  .brand-text span{
    font-size:.63rem;
  }

}
</style>

<header class="navbar">
  <div class="nav-container">
  <div class="nav-inner">

    <a href="index.html" class="brand">
      <img src="vedlogo.jpeg" alt="VED Foundation Logo">

      <div class="brand-text">
        <strong>VED FOUNDATION</strong>
        <span>Education • Skills • Empowerment</span>
      </div>
    </a>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="smartclasses.html">Smart Classes</a>
      <a href="agriculture.html">Agriculture</a>
      <a href="solarpanel.html">Solar Panel</a>
      <a href="workshops.html" id="navWorkshopsLink" style="position:relative">
        Workshop Center
        <span id="navLiveDot" style="display:none;position:absolute;top:18px;right:-8px;width:7px;height:7px;background:#ef4444;border-radius:50%;animation:navBlink 1s ease infinite"></span>
      </a>
      <a href="registeration.html">Register</a>
      <a href="login.html">Login</a>
      <a href="donation.html">Donation</a>
    </nav>
    <style>@keyframes navBlink{0%,100%{opacity:1}50%{opacity:.1}}</style>
    <script>
      // Check if any workshop is live and show dot on nav
      fetch((window.VED_API_BASE || 'http://localhost:5000/api') + '/workshops/live')
        .then(r=>r.json())
        .then(d=>{ if((d.live||[]).length>0){ const dot=document.getElementById('navLiveDot'); if(dot) dot.style.display='block'; } })
        .catch(()=>{});
    </script>

    <div class="nav-actions">
      <a href="donation.html" class="btn btn-orange">Donate Now</a>
      <a href="registeration.html" class="btn btn-blue">Enroll</a>
    </div>

    <button class="menu-toggle" id="menuToggle">☰</button>

  </div>
  </div>
</header>
